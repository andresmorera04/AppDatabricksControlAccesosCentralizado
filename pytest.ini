[pytest]
# Configuración de pytest del proyecto según el estándar de desarrollo (README.md).
# El estándar obliga a nombrar clases, funciones y métodos en PascalCase, por lo que
# se ajusta el descubrimiento de pytest (que por defecto solo busca "test*") a la
# convención "Test*" del proyecto.

# Convención de descubrimiento de pruebas: PascalCase (estándar del proyecto).
python_functions = Test*
python_classes = Test*
python_files = test_*.py

# Directorios de la suite, organizados por capa (tests/unitarias, funcionales,
# aceptación; la capa integrales — marker `free` — se estrena en C2 con las
# pruebas contra el workspace andresFree).
testpaths = tests

# Opciones por defecto: strict-markers falla la colección si se usa un marker
# no registrado, evitando errores de tipeo silenciosos en las pruebas.
addopts = --strict-markers

# Markers registrados para las capas de la suite. Las pruebas integrales contra
# workspaces reales se estrenan en C2 (`persistencia-bitacora`) sobre el perfil
# CLI andresFree; se declaran aquí para que el perfil de cada prueba sea
# explícito y verificable por --strict-markers.
markers =
    free: prueba integral contra el workspace primario andresFree (perfil CLI)
    azure_approval: prueba integral contra el workspace andresAzureDev; solo con aprobación expresa del humano
