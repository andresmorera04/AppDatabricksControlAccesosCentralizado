schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
context: |
  Escribe todos los artefactos en español.
  Estándar de desarrollo obligatorio en todo el proyecto (aplica a specs,
  designs, tasks e implementación de todos los changes):
  - Convención de nombres: constantes NOMBRE_CONSTANTE (mayúsculas); variables
    y objetos snake_case; clases, funciones y métodos PascalCase (pytest con
    python_functions = Test*); SQL en mayúsculas; código y comentarios
    detallados en español.
  - Regla estricta: código NO hardcodeado; todo valor desde el archivo de
    propiedades config/app_properties.json (atributo "catalogo", default
    "control").
  - Persistencia: solo tablas delta idempotentes en el esquema dedicado
    control_acceso_app (creado idempotentemente), con liquid clustering,
    change data feed, optimizeWrite y autoCompact. Prohibido Lakebase.
  - Bitácora de eventos (con usuario que provoca el evento, identidad OBO) y
    bitácora de errores (detalle tipo STRUCT<...>); errores vía try/except.
  - POO como paradigma principal; PySpark preferente con funciones masivas
    (ciclos solo cuando no haya función optimizada); integridad PK/FK y
    referencial garantizada en el código de la aplicación.
  - Metodología TDD (red -> green -> refactor) y suite por change: unitarias,
    funcionales, integrales (perfil CLI andresFree; andresAzureDev solo con
    aprobación expresa, marker azure_approval) y de aceptación, con informe
    por change.
  - Trazabilidad obligatoria: cualquier ajuste, mejora o corrección de bugs
    que cambie código debe registrarse como tarea en el tasks.md del change
    activo; los hallazgos y su corrección se documentan además en el
    delta-spec cuando afecten comportamiento especificado, con sus propias
    tareas. Nada de código sin trazabilidad en artefactos.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
